# CoJ2ChatFilter configuration
# 1 = show ONLY team messages (drops global chat, keeps squad chat)
teamonly 0

# 1 = enable name-based muting (set 0 if the game ever crashes
#     because of the name reader, to use flags-only filtering)
mutenames 1

# One player name per line. Case-insensitive. Exact match.
mute SomeToxicPlayer
mute AnotherAnnoyingGuy
